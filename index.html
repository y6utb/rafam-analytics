<!doctype html><html lang="ru"><head><meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAFAM — аналитика</title>
<meta name="description" content="Управленческий дашборд RAFAM: выручка, маржа, план/факт, остатки и аномалии по точкам и городам за выбранный день.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --frame:#2F6B50;--frame-deep:#245640;--frame-ink:#F4EFE3;
  --ground:#EFE9DB;--card:#F7F3E9;--card-line:#2B5A45;
  --ink:#1F4535;--ink-2:#4E6A5C;--muted:#7F9288;
  --grid:#DED7C6;--track:#E7DFcd;--track2:#EAE3D2;
  --bar:#6FA595;--bar-strong:#2F6B50;--fact:#2F6B50;--plan:#B9C6BE;
  --good:#2F7A4C;--bad:#A8432E;--bad-wash:#F4DDD5;--good-wash:#D9EBDD;
  --focus:#B8672A;--font:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--frame)}
body{margin:0;color:var(--ink);font:500 14.5px/1.5 var(--font);padding-inline:16px;padding-block:0 40px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
header.top{color:var(--frame-ink);padding-block:22px 16px;display:grid;gap:14px}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{margin:0;font-size:clamp(23px,3vw,31px);font-weight:800;letter-spacing:.01em}
.stamp{font-size:13px;opacity:.85;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--frame-deep);border-radius:8px;padding:12px 14px}
.f{display:grid;gap:5px}
.f>span,.f>label>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
select.ctl{background:var(--frame-ink);color:var(--ink);border:0;border-radius:6px;padding:6px 28px 6px 10px;font-weight:700;font-size:13.5px}
.seg{display:inline-flex;border:1px solid rgba(244,239,227,.35);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 14px;font-weight:700;font-size:13.5px;color:var(--frame-ink);cursor:pointer}
.seg button+button{border-left:1px solid rgba(244,239,227,.25)}
.seg button[aria-pressed="true"]{background:var(--frame-ink);color:var(--frame-deep)}
main.panel{background:var(--ground);border-radius:10px;padding:18px;display:grid;gap:16px}
.scope-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.scope-line h2{margin:0;font-size:19px;font-weight:800}
.scope-line p{margin:0;color:var(--ink-2);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:460px}
.tile{background:var(--card);border:1.5px solid var(--card-line);border-radius:4px;padding:12px 14px;display:grid;gap:3px;align-content:start;min-width:0}
.tile .lab{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25}
.tile .val{font-size:clamp(19px,2.1vw,26px);font-weight:800;line-height:1.1;color:var(--ink);white-space:nowrap}
.tile .val small{font-size:.5em;font-weight:700;color:var(--ink-2);margin-left:3px}
.tile .sub{font-size:12px;font-weight:700}
.tile .sub.up{color:var(--good)}.tile .sub.down{color:var(--bad)}.tile .sub.flat{color:var(--ink-2)}
.sect{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.02em;margin:4px 0 -4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1.5px solid var(--card-line);border-radius:4px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:800;text-align:center}
.card .hint{margin:-4px 0 0;font-size:12px;color:var(--ink-2);text-align:center}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(84px,34%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.bar-track{background:var(--track2);border-radius:3px;height:16px;position:relative;overflow:hidden}
.bar-fill{height:100%;background:var(--bar);border-radius:3px;min-width:2px}
.bar-fill.strong{background:var(--bar-strong)}
.bar-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.bar-row .vl{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);white-space:nowrap}
.bar-row .vl small{color:var(--ink-2);font-weight:600}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th,table.tb td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
table.tb th{font-weight:800;color:var(--ink);position:sticky;top:0;background:var(--card)}
table.tb td.r,table.tb th.r{text-align:right;font-variant-numeric:tabular-nums}
table.tb td.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.tb-wrap{overflow:auto;max-height:440px}
.cell-bad{background:var(--bad-wash)}.cell-good{background:var(--good-wash)}
.pie-wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.pie-leg{display:grid;gap:4px;font-size:12.5px}
.pie-leg div{display:flex;align-items:center;gap:7px}
.pie-leg i{width:11px;height:11px;border-radius:3px;flex:none}
.pie-leg b{font-variant-numeric:tabular-nums;margin-left:auto;padding-left:14px}
svg{display:block;overflow:visible}
svg text{font-family:var(--font)}
.foot{color:var(--frame-ink);opacity:.8;font-size:12px;padding:14px 2px 0;text-align:center}
</style></head><body>

const cityName=ci=>ci>=0?CITIES[ci]:"—";
function storesDay(di,city){return S.filter(s=>s.di===di&&(city===""||cityName(s.ci)===city))}
function kpi(di,city){
  if(di<0)return null;
  const a=storesDay(di,city);if(!a.length)return null;
  const rev=a.reduce((s,x)=>s+x.rev,0),margin=a.reduce((s,x)=>s+x.margin,0);
  const pl=a.filter(x=>x.plan!=null);
  const planSum=pl.reduce((s,x)=>s+x.plan,0),revPl=pl.reduce((s,x)=>s+x.rev,0);
  return{rev,margin,rent:rev?100*margin/rev:null,pct:planSum?100*revPl/planSum:null,
    sret:a.reduce((s,x)=>s+x.sret,0),scost:a.reduce((s,x)=>s+x.scost,0),points:a.length};
}
function deltaSub(cur,prev,kind){
  if(cur==null)return el("div",{class:"sub flat"},"нет данных");
  if(prev==null)return el("div",{class:"sub flat"},"нет пред. дня");
  const d=cur-prev;const up=d>=0;
  let txt;
  if(kind==="pp")txt=(up?"▲ +":"▼ ")+Math.abs(d).toFixed(1)+" пп к пред. дню";
  else{const p=prev?100*d/prev:0;txt=(up?"▲ +":"▼ ")+Math.abs(p).toFixed(1)+" % к пред. дню"}
  return el("div",{class:"sub "+(Math.abs(d)<1e-9?"flat":up?"up":"down")},txt);
}

function bars(items,{fmt=fmtRub0,unit="",strong=false,markFmt=null}={}){
  const box=el("div",{class:"bars"});
  if(!items.length)return el("div",{class:"empty"},"нет данных");
  const max=Math.max(...items.map(i=>Math.abs(i.value)),1);
  for(const it of items){
    const row=el("div",{class:"bar-row"});
    row.append(el("div",{class:"nm",title:it.label},it.label));
    const tr=el("div",{class:"bar-track"});
    const fl=el("div",{class:"bar-fill"+(strong?" strong":"")});fl.style.width=(100*Math.abs(it.value)/max)+"%";
    if(it.mark!=null){const m=el("div",{class:"bar-mark"});m.style.left=Math.min(100,100*it.mark/max)+"%";m.title="план";tr.append(fl,m)}else tr.append(fl);
    row.append(tr);
    const vl=el("div",{class:"vl",html:fmt(it.value)+unit+(it.note?` <small>${it.note}</small>`:"")});
    row.append(vl);box.append(row);
  }
  return box;
}

const PIE=["#2F6B50","#6FA595","#B8672A","#4E6A5C","#A9BAB0","#8A5B12","#338A66","#C4906A","#7F9288","#D8C9A3"];
function pie(items){
  const wrap=el("div",{class:"pie-wrap"});
  const tot=items.reduce((s,i)=>s+i.value,0);
  if(tot<=0)return el("div",{class:"empty"},"нет данных");
  const R=70,C=80,sw=28;let a0=-Math.PI/2;
  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 160 160");svg.setAttribute("width","160");svg.setAttribute("height","160");
  items.forEach((it,i)=>{
    const frac=it.value/tot,a1=a0+frac*2*Math.PI;
    const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
    const large=frac>.5?1:0;
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",`M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`);
    p.setAttribute("fill","none");p.setAttribute("stroke",PIE[i%PIE.length]);p.setAttribute("stroke-width",sw);
    svg.append(p);a0=a1;
  });
  const leg=el("div",{class:"pie-leg"});
  items.forEach((it,i)=>{const r=el("div");r.append(el("i",{style:`background:${PIE[i%PIE.length]}`}));
    r.append(el("span",null,it.label));r.append(el("b",{class:"num"},Math.round(100*it.value/tot)+"%"));leg.append(r)});
  wrap.append(svg,leg);return wrap;
}

function line(pts){
  if(pts.length<2)return el("div",{class:"empty"},"нужно ≥2 дней");
  const W=640,H=200,L=58,R=14,T=14,B=28;
  const max=Math.max(...pts.map(p=>p.v)),min=Math.min(...pts.map(p=>p.v),0);
  const X=i=>L+(W-L-R)*(pts.length===1?0:i/(pts.length-1));
  const Y=v=>T+(H-T-B)*(1-(v-min)/((max-min)||1));
  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width","100%");svg.setAttribute("class","num");
  for(let g=0;g<=3;g++){const y=T+(H-T-B)*g/3,v=max-(max-min)*g/3;
    const ln=document.createElementNS(NS,"line");ln.setAttribute("x1",L);ln.setAttribute("x2",W-R);ln.setAttribute("y1",y);ln.setAttribute("y2",y);ln.setAttribute("stroke","#DED7C6");ln.setAttribute("stroke-width",".7");svg.append(ln);
    const tx=document.createElementNS(NS,"text");tx.setAttribute("x",L-6);tx.setAttribute("y",y+3);tx.setAttribute("text-anchor","end");tx.setAttribute("font-size","11");tx.setAttribute("fill","#7F9288");tx.textContent=fmtRub0(v);svg.append(tx)}
  let d="";pts.forEach((p,i)=>{d+=(i?"L":"M")+X(i)+" "+Y(p.v)+" "});
  const path=document.createElementNS(NS,"path");path.setAttribute("d",d);path.setAttribute("fill","none");path.setAttribute("stroke","#2F6B50");path.setAttribute("stroke-width","2.5");path.setAttribute("stroke-linejoin","round");svg.append(path);
  pts.forEach((p,i)=>{const c=document.createElementNS(NS,"circle");c.setAttribute("cx",X(i));c.setAttribute("cy",Y(p.v));c.setAttribute("r","3.5");c.setAttribute("fill","#2F6B50");svg.append(c);
    const tx=document.createElementNS(NS,"text");tx.setAttribute("x",X(i));tx.setAttribute("y",H-10);tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","11");tx.setAttribute("fill","#4E6A5C");tx.textContent=p.lab;svg.append(tx)});
  return svg;
}

  tiles.append(tile("Выполнение плана",k&&k.pct!=null?k.pct.toFixed(1)+'<small>%</small>':"—",deltaSub(k&&k.pct,kp&&kp.pct,"pp")));
  tiles.append(tile("Остатки, розница",k?fmtRub(k.sret):"—",deltaSub(k&&k.sret,kp&&kp.sret)));
  tiles.append(tile("Остатки, себес.",k?fmtRub(k.scost):"—",deltaSub(k&&k.scost,kp&&kp.scost)));
  root.append(tiles);

  // Продажи
  root.append(el("div",{class:"sect"},"Продажи"));
  const g1=el("div",{class:"g2"});
  g1.append(cardWrap("Выручка по точкам — топ-15",null,
    bars(topN(a,"rev",15).map(s=>({label:s.store,value:s.rev})),{fmt:fmtRub0,strong:true})));
  const catRev=CS.filter(c=>c.di===di&&(cat===""||c.cat===cat)).sort((x,y)=>y.rev-x.rev);
  g1.append(cardWrap("Выручка по категориям",city?"по сети (без фильтра города)":null,
    pie(catRev.map(c=>({label:c.cat,value:c.rev})))));
  root.append(g1);

  // План / факт
  root.append(el("div",{class:"sect"},"План / факт"));
  const pf=a.filter(s=>s.plan!=null);
  const g2=el("div",{class:"g3"});
  g2.append(cardWrap("План vs факт — топ-15",null,
    bars(topN(pf,"rev",15).map(s=>({label:s.store,value:s.rev,mark:s.plan,note:s.pct!=null?s.pct.toFixed(0)+"%":""})),{fmt:fmtRub0,strong:true})));
  g2.append(cardWrap("Перевыполнение плана — топ-15",null,
    bars(pf.filter(s=>s.pct!=null).sort((x,y)=>y.pct-x.pct).slice(0,15).map(s=>({label:s.store,value:s.pct})),{fmt:v=>v.toFixed(0),unit:" %",strong:true})));
  g2.append(cardWrap("Недовыполнение плана — топ-15",null,
    bars(pf.filter(s=>s.pct!=null).sort((x,y)=>x.pct-y.pct).slice(0,15).map(s=>({label:s.store,value:s.pct})),{fmt:v=>v.toFixed(0),unit:" %"})));
  root.append(g2);

  // Товары и маржа
  root.append(el("div",{class:"sect"},"Товары и маржа"));
  const g3=el("div",{class:"g2"});
  const prAgg={};PR.filter(p=>p.di===di&&(city===""||cityName(p.ci)===city)&&(cat===""||CATS[p.ki]===cat)).forEach(p=>{prAgg[p.prod]=(prAgg[p.prod]||0)+p.rev});
  const prTop=Object.entries(prAgg).map(([prod,rev])=>({label:prod,value:rev})).sort((x,y)=>y.value-x.value).slice(0,15);
  g3.append(cardWrap("Топ-15 товаров по выручке",null,bars(prTop,{fmt:fmtRub0,strong:true})));
  const catM=CS.filter(c=>c.di===di&&c.mpct!=null&&(cat===""||c.cat===cat)).sort((x,y)=>y.rev-x.rev);
  g3.append(cardWrap("Маржинальность по категориям",null,bars(catM.map(c=>({label:c.cat,value:c.mpct})),{fmt:v=>v.toFixed(1),unit:" %"})));
  root.append(g3);

  // Склад и аномалии
  root.append(el("div",{class:"sect"},"Склад и аномалии"));
  const g4=el("div",{class:"g2"});
  g4.append(cardWrap("Остатки в рознице по точкам — топ-15",null,
    bars(topN(a,"sret",15).map(s=>({label:s.store,value:s.sret})),{fmt:fmtRub0,strong:true})));
  const an=AN.filter(x=>x.di===di&&(city===""||cityName(x.ci)===city)&&(cat===""||CATS[x.ki]===cat)).slice(0,100);
  g4.append(cardWrap("Аномалии: отрицательные остатки",null,anomalyTable(an)));
  root.append(g4);

  // Сводка по точкам
  root.append(cardWrap("Сводка по точкам",null,storeTable(a)));

  // Динамика
  root.append(el("div",{class:"sect"},"Динамика"));
  const dyn=DAYS.map((iso,i)=>{const kk=kpi(i,city);return{lab:dfmt(iso).slice(0,5),v:kk?kk.rev:0}});
  root.append(cardWrap("Динамика выручки по дням",city?"город: "+city:"по всей сети",line(dyn)));
}

function storeTable(a){
  const w=el("div",{class:"tb-wrap"});const t=el("table",{class:"tb"});
  t.innerHTML="<thead><tr><th>Точка</th><th>Город</th><th class=r>Выручка</th><th class=r>Маржа</th><th class=r>Маржа %</th><th class=r>План/день</th><th class=r>% плана</th><th class=r>Остатки</th></tr></thead>";
  const tb=el("tbody");
  a.slice().sort((x,y)=>y.rev-x.rev).forEach(s=>{
    const tr=el("tr");
    tr.append(el("td",{class:"nm",title:s.store},s.store),el("td",null,cityName(s.ci)),
      el("td",{class:"r"},fmtRub0(s.rev)),el("td",{class:"r"},fmtRub0(s.margin)),
      el("td",{class:"r"},s.mpct!=null?s.mpct.toFixed(1):"—"),
      el("td",{class:"r"},s.plan!=null?fmtRub0(s.plan):"—"));
    const pc=el("td",{class:"r"+(s.pct==null?"":s.pct>=100?" cell-good":" cell-bad")},s.pct!=null?s.pct.toFixed(1):"—");
    tr.append(pc,el("td",{class:"r"},fmtRub0(s.sret)));
    tb.append(tr);
  });
  t.append(tb);w.append(t);return w;
}
function anomalyTable(an){
  if(!an.length)return el("div",{class:"empty"},"отрицательных остатков нет");
  const w=el("div",{class:"tb-wrap"});const t=el("table",{class:"tb"});
  t.innerHTML="<thead><tr><th>Точка</th><th>Товар</th><th class=r>Остаток</th><th class=r>Сумма</th></tr></thead>";
  const tb=el("tbody");
  an.forEach(x=>{const tr=el("tr");tr.append(el("td",{class:"nm",title:x.store},x.store),el("td",{class:"nm",title:x.prod},x.prod),
    el("td",{class:"r"},fmtMl(x.qty)),el("td",{class:"r"},fmtRub0(x.ret)));tb.append(tr)});
  t.append(tb);w.append(t);return w;
}

function renderCities(){
  const di=st.di,city=st.city;const root=$("#tab-cities");root.innerHTML="";
  // агрегируем точки по городам за день
  const m={};storesDay(di,"").forEach(s=>{if(s.ci<0)return;const c=CITIES[s.ci];if(city&&c!==city)return;
    const o=m[c]||(m[c]={city:c,points:0,rev:0,margin:0,plan:0,revPl:0,sret:0});
    o.points++;o.rev+=s.rev;o.margin+=s.margin;o.sret+=s.sret;if(s.plan!=null){o.plan+=s.plan;o.revPl+=s.rev}});
  const rowsArr=Object.values(m).map(o=>({...o,mpct:o.rev?100*o.margin/o.rev:null,pct:o.plan?100*o.revPl/o.plan:null}));
  // tiles
  const tiles=el("div",{class:"tiles two"});
  tiles.append(tile("Городов",fmtInt(rowsArr.length)));
  tiles.append(tile("Точек всего",fmtInt(rowsArr.reduce((s,x)=>s+x.points,0))));
  root.append(tiles);

  root.append(el("div",{class:"sect"},"Продажи и план по городам"));
  const g1=el("div",{class:"g2"});
  g1.append(cardWrap("Выручка по городам",null,bars(topN(rowsArr,"rev",15).map(o=>({label:o.city,value:o.rev})),{fmt:fmtRub0,strong:true})));
  g1.append(cardWrap("План vs факт по городам",null,bars(rowsArr.filter(o=>o.plan>0).sort((a,b)=>b.rev-a.rev).slice(0,15).map(o=>({label:o.city,value:o.revPl,mark:o.plan,note:o.pct!=null?o.pct.toFixed(0)+"%":""})),{fmt:fmtRub0,strong:true})));
  root.append(g1);
  const g2=el("div",{class:"g2"});
  g2.append(cardWrap("Выполнение плана по городам",null,bars(rowsArr.filter(o=>o.pct!=null).sort((a,b)=>b.pct-a.pct).slice(0,15).map(o=>({label:o.city,value:o.pct})),{fmt:v=>v.toFixed(0),unit:" %",strong:true})));
  g2.append(cardWrap("Остатки по городам",null,bars(topN(rowsArr,"sret",15).map(o=>({label:o.city,value:o.sret})),{fmt:fmtRub0,strong:true})));
  root.append(g2);

  root.append(cardWrap("Сводка по городам",null,cityTable(rowsArr)));
}
function cityTable(rowsArr){
  const w=el("div",{class:"tb-wrap"});const t=el("table",{class:"tb"});
  t.innerHTML="<thead><tr><th>Город</th><th class=r>Точек</th><th class=r>Выручка</th><th class=r>Маржа</th><th class=r>Маржа %</th><th class=r>План/день</th><th class=r>% плана</th><th class=r>Остатки</th></tr></thead>";
  const tb=el("tbody");
  rowsArr.slice().sort((a,b)=>b.rev-a.rev).forEach(o=>{
    const tr=el("tr");
    tr.append(el("td",{class:"nm"},o.city),el("td",{class:"r"},fmtInt(o.points)),
      el("td",{class:"r"},fmtRub0(o.rev)),el("td",{class:"r"},fmtRub0(o.margin)),
      el("td",{class:"r"},o.mpct!=null?o.mpct.toFixed(1):"—"),
      el("td",{class:"r"},o.plan?fmtRub0(o.plan):"—"));
    tr.append(el("td",{class:"r"+(o.pct==null?"":o.pct>=100?" cell-good":" cell-bad")},o.pct!=null?o.pct.toFixed(1):"—"),
      el("td",{class:"r"},fmtRub0(o.sret)));
    tb.append(tr);
  });
  t.append(tb);w.append(t);return w;
}

function render(){
  $("#stamp").textContent="Остатки и продажи на "+DATA.asOf;
  const scope=[st.city||"вся сеть",st.cat||"все категории"].join(" · ");
  $("#scope-title").textContent=st.tab==="points"?"Точки":"Города";
  $("#scope-sub").textContent="День: "+dfmt(DAYS[st.di])+" · "+scope;
  $("#tab-points").hidden=st.tab!=="points";
  $("#tab-cities").hidden=st.tab!=="cities";
  if(st.tab==="points")renderPoints();else renderCities();
  $("#foot").textContent="RAFAM · управленческая аналитика · данные на "+DATA.asOf;
}
initFilters();render();
</script>
</body></html>
