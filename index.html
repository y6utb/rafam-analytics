<!doctype html><html lang="ru"><head><meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAFAM — аналитика</title>
<meta name="description" content="Управленческий дашборд RAFAM: выручка, маржа, план/факт, остатки и аномалии по точкам и городам за выбранный день или период.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --frame:#2F6B50;--frame-deep:#245640;--frame-ink:#F4EFE3;
  --ground:#EFE9DB;--card:#F7F3E9;--card-line:#2B5A45;
  --ink:#1F4535;--ink-2:#4E6A5C;--muted:#7F9288;
  --grid:#DED7C6;--track2:#EAE3D2;
  --bar:#6FA595;--bar-strong:#2F6B50;--plan:#B9C6BE;
  --good:#2F7A4C;--bad:#A8432E;--bad-wash:#F4DDD5;--good-wash:#D9EBDD;
  --focus:#B8672A;--font:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--frame)}
body{margin:0;color:var(--ink);font:500 14.5px/1.5 var(--font);padding-inline:16px;padding-block:0 40px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
header.top{color:var(--frame-ink);padding-block:22px 16px;display:grid;gap:14px}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{margin:0;font-size:clamp(23px,3vw,31px);font-weight:800;letter-spacing:.01em}
.stamp{font-size:13px;opacity:.85;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--frame-deep);border-radius:8px;padding:12px 14px}
.f{display:grid;gap:5px}
.f>span,.f>label>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
select.ctl{background:var(--frame-ink);color:var(--ink);border:0;border-radius:6px;padding:6px 28px 6px 10px;font-weight:700;font-size:13.5px}
input.ctl{background:var(--frame-ink);color:var(--ink);border:0;border-radius:6px;padding:6px 10px;font-weight:700;font-size:13.5px;min-width:0}
input.ctl[type=date]{cursor:pointer}
.seg{display:inline-flex;border:1px solid rgba(244,239,227,.35);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 14px;font-weight:700;font-size:13.5px;color:var(--frame-ink);cursor:pointer}
.seg button+button{border-left:1px solid rgba(244,239,227,.25)}
.seg button[aria-pressed="true"]{background:var(--frame-ink);color:var(--frame-deep)}
main.panel{background:var(--ground);border-radius:10px;padding:18px;display:grid;gap:16px}
.scope-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.scope-line h2{margin:0;font-size:19px;font-weight:800}
.scope-line p{margin:0;color:var(--ink-2);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media(max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1.5px solid var(--card-line);border-radius:4px;padding:12px 14px;display:grid;gap:3px;align-content:start;min-width:0}
.tile .lab{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25}
.tile .val{font-size:clamp(19px,2.1vw,26px);font-weight:800;line-height:1.1;color:var(--ink);white-space:nowrap}
.tile .val small{font-size:.5em;font-weight:700;color:var(--ink-2);margin-left:3px}
.tile .sub{font-size:12px;font-weight:700}
.tile .sub.up{color:var(--good)}.tile .sub.down{color:var(--bad)}.tile .sub.flat{color:var(--ink-2)}
.sect{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.02em;margin:4px 0 -4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1.5px solid var(--card-line);border-radius:4px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:800;text-align:center}
.card .hint{margin:-4px 0 0;font-size:12px;color:var(--ink-2);text-align:center}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(84px,34%) 1fr auto;gap:10px;align-items:center;font-size:12.5px;cursor:default}
.bar-row:hover .bar-fill{filter:brightness(1.07)}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.bar-track{background:var(--track2);border-radius:3px;height:16px;position:relative;overflow:hidden}
.bar-fill{height:100%;background:var(--bar);border-radius:3px;min-width:2px}
.bar-fill.strong{background:var(--bar-strong)}
.bar-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.bar-row .vl{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);white-space:nowrap}
.bar-row .vl small{color:var(--ink-2);font-weight:600}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th,table.tb td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
table.tb th{font-weight:800;color:var(--ink);position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none}
table.tb th.r,table.tb td.r{text-align:right;font-variant-numeric:tabular-nums}
table.tb th.asc::after{content:" ▲";font-size:9px;color:var(--ink-2)}
table.tb th.desc::after{content:" ▼";font-size:9px;color:var(--ink-2)}
table.tb td.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.tb-wrap{overflow:auto;max-height:440px}
.cell-bad{background:var(--bad-wash)}.cell-good{background:var(--good-wash)}
.pie-wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.pie-leg{display:grid;gap:4px;font-size:12.5px}
.pie-leg div{display:flex;align-items:center;gap:7px}
.pie-leg i{width:11px;height:11px;border-radius:3px;flex:none}
.pie-leg b{font-variant-numeric:tabular-nums;margin-left:auto;padding-left:14px}
svg{display:block;overflow:visible}
svg text{font-family:var(--font)}
.tip{position:fixed;z-index:50;pointer-events:none;background:#1F4535;color:#F7F3E9;border-radius:6px;padding:7px 10px;font-size:12.5px;line-height:1.45;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.tip .t-name{font-weight:700;margin-bottom:2px}
.tip b{font-size:14px;font-weight:800}
.foot{color:var(--frame-ink);opacity:.8;font-size:12px;padding:14px 2px 0;text-align:center}
.dfl{display:contents}
.title-side{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.pagebtn{background:var(--frame-ink);color:var(--frame-deep);border:0;border-radius:8px;padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.pagebtn:hover{filter:brightness(.96)}
.pnl-ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--frame-deep);border-radius:8px;padding:12px 14px}
.pnl-ctl .f>span{color:var(--frame-ink)}
.pnl-ctl select{background:var(--frame-ink)!important;border:0!important}
.note{background:var(--warn,#F6E8C9);color:#8A5B12;border-radius:6px;padding:8px 12px;font-size:12.5px;font-weight:600}
table.pnl{width:100%;border-collapse:collapse;font-size:12.5px}
table.pnl th,table.pnl td{padding:5px 9px;border-bottom:1px solid var(--grid);white-space:nowrap}
table.pnl thead th{position:sticky;top:0;background:var(--card);font-weight:800;text-align:right}
table.pnl th.it,table.pnl td.it{text-align:left;position:sticky;left:0;background:var(--card);max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.pnl td{text-align:right;font-variant-numeric:tabular-nums}
table.pnl tr.rev td,table.pnl tr.rev th{font-weight:800;border-bottom:1.5px solid var(--card-line)}
table.pnl tr.net td,table.pnl tr.net th{font-weight:800;border-top:1.5px solid var(--card-line);background:#EFE9DB}
table.pnl td.neg{color:var(--bad)}
table.pnl th.selm,table.pnl td.selm{background:#EDE0C8}
table.pnl tr.net td.selm{background:#E3D8BA}
</style></head><body>

// агрегируем точки по набору дней: выручка/маржа/план — сумма, остатки — на последний день периода
function aggStores(dset,city){
  const by={};
  for(const s of S){ if(!dset.includes(s.di))continue; if(city&&cityName(s.ci)!==city)continue;
    const o=by[s.store]||(by[s.store]={store:s.store,ci:s.ci,rev:0,margin:0,plan:0,planHas:false,sret:0,scost:0,_ls:-1});
    o.rev+=s.rev;o.margin+=s.margin;if(s.plan!=null){o.plan+=s.plan;o.planHas=true}
    if(s.di>o._ls){o._ls=s.di;o.sret=s.sret;o.scost=s.scost}
  }
  return Object.values(by).map(o=>({store:o.store,ci:o.ci,cityn:cityName(o.ci),rev:o.rev,margin:o.margin,
    plan:o.planHas?o.plan:null,sret:o.sret,scost:o.scost,
    mpct:o.rev?100*o.margin/o.rev:null,pct:o.planHas&&o.plan?100*o.rev/o.plan:null}));
}
function kpiAgg(dset,city){const a=aggStores(dset,city);if(!a.length)return null;
  const rev=a.reduce((s,x)=>s+x.rev,0),margin=a.reduce((s,x)=>s+x.margin,0);
  const pl=a.filter(x=>x.plan!=null),planSum=pl.reduce((s,x)=>s+x.plan,0),revPl=pl.reduce((s,x)=>s+x.rev,0);
  return{rev,margin,rent:rev?100*margin/rev:null,pct:planSum?100*revPl/planSum:null,
    sret:a.reduce((s,x)=>s+x.sret,0),scost:a.reduce((s,x)=>s+x.scost,0)};}
function catAgg(dset,city,catF){
  const m={};PR.filter(p=>dset.includes(p.di)&&(city===""||cityName(p.ci)===city)&&(catF===""||CATS[p.ki]===catF)).forEach(p=>{
    const name=p.ki>=0?CATS[p.ki]:"—";const o=m[name]||(m[name]={cat:name,rev:0,margin:0});o.rev+=p.rev;o.margin+=p.margin});
  return Object.values(m).map(o=>({...o,mpct:o.rev?100*o.margin/o.rev:null})).sort((a,b)=>b.rev-a.rev);
}

function deltaSub(cur,prev,kind){
  if(cur==null)return el("div",{class:"sub flat"},"нет данных");
  if(prev==null)return el("div",{class:"sub flat"},"нет пред. дня");
  const d=cur-prev,up=d>=0;let txt;
  if(kind==="pp")txt=(up?"▲ +":"▼ ")+Math.abs(d).toFixed(1)+" пп к пред. дню";
  else{const p=prev?100*d/prev:0;txt=(up?"▲ +":"▼ ")+Math.abs(p).toFixed(1)+" % к пред. дню"}
  return el("div",{class:"sub "+(Math.abs(d)<1e-9?"flat":up?"up":"down")},txt);
}
function subInfo(){return el("div",{class:"sub flat"},isSingle()?"нет пред. дня":"итог за "+selDays().length+" дн.")}
function tile(lab,valHtml,sub){const t=el("div",{class:"tile"});t.append(el("div",{class:"lab"},lab),el("div",{class:"val",html:valHtml}));if(sub)t.append(sub);return t}
function tileK(lab,valHtml,cur,prev,kind){return tile(lab,valHtml,showDelta?deltaSub(cur,prev,kind):subInfo())}

function bars(items,{fmt=fmtRub0,unit="",strong=false,tipUnit=null}={}){
  if(!items.length)return el("div",{class:"empty"},"нет данных");
  const box=el("div",{class:"bars"});
  const max=Math.max(...items.map(i=>Math.abs(i.value)),1);
  for(const it of items){
    const row=el("div",{class:"bar-row"});
    row.append(el("div",{class:"nm",title:it.label},it.label));
    const tr=el("div",{class:"bar-track"});
    const fl=el("div",{class:"bar-fill"+(strong?" strong":"")});fl.style.width=(100*Math.abs(it.value)/max)+"%";
    if(it.mark!=null){const m=el("div",{class:"bar-mark"});m.style.left=Math.min(100,100*it.mark/max)+"%";tr.append(fl,m)}else tr.append(fl);
    row.append(tr,el("div",{class:"vl",html:fmt(it.value)+unit+(it.note?` <small>${it.note}</small>`:"")}));
    let th=`<div class="t-name">${it.label}</div><b>${fmt(it.value)+unit}</b>`;
    if(it.mark!=null)th+=`<div>план: ${fmt(it.mark)}${it.note?" · "+it.note:""}</div>`;
    bindTip(row,th);
    box.append(row);
  }
  return box;
}
function cardWrap(title,hint,content){const c=el("div",{class:"card"});c.append(el("h3",null,title));if(hint)c.append(el("p",{class:"hint"},hint));c.append(content);return c}

const PIE=["#2F6B50","#6FA595","#B8672A","#4E6A5C","#A9BAB0","#8A5B12","#338A66","#C4906A","#7F9288","#D8C9A3","#5E7D6E"];
function pie(items){
  const tot=items.reduce((s,i)=>s+i.value,0);
  if(tot<=0)return el("div",{class:"empty"},"нет данных");
  const R=70,C=80,sw=28;let a0=-Math.PI/2;
  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 160 160");svg.setAttribute("width","160");svg.setAttribute("height","160");
  items.forEach((it,i)=>{const frac=it.value/tot,a1=a0+frac*2*Math.PI;
    const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1),large=frac>.5?1:0;
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",`M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`);
    p.setAttribute("fill","none");p.setAttribute("stroke",PIE[i%PIE.length]);p.setAttribute("stroke-width",sw);p.style.cursor="default";
    bindTip(p,`<div class="t-name">${it.label}</div><b>${fmtRub(it.value)}</b><div>${(100*it.value/tot).toFixed(1)}% выручки</div>`);
    svg.append(p);a0=a1;});
  const leg=el("div",{class:"pie-leg"});
  items.forEach((it,i)=>{const r=el("div");r.append(el("i",{style:`background:${PIE[i%PIE.length]}`}),el("span",null,it.label),el("b",{class:"num"},Math.round(100*it.value/tot)+"%"));
    bindTip(r,`<div class="t-name">${it.label}</div><b>${fmtRub(it.value)}</b>`);leg.append(r)});
  const wrap=el("div",{class:"pie-wrap"});wrap.append(svg,leg);return wrap;
}

function line(pts){
  if(pts.length<2)return el("div",{class:"empty"},"нужно ≥2 дней");
  const W=640,H=200,L=58,R=14,T=14,B=28;
  const max=Math.max(...pts.map(p=>p.v)),min=Math.min(...pts.map(p=>p.v),0);
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-min)/((max-min)||1));
  const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width","100%");svg.setAttribute("class","num");
  for(let g=0;g<=3;g++){const y=T+(H-T-B)*g/3,v=max-(max-min)*g/3;
    const ln=document.createElementNS(NS,"line");ln.setAttribute("x1",L);ln.setAttribute("x2",W-R);ln.setAttribute("y1",y);ln.setAttribute("y2",y);ln.setAttribute("stroke","#DED7C6");ln.setAttribute("stroke-width",".7");svg.append(ln);
    const tx=document.createElementNS(NS,"text");tx.setAttribute("x",L-6);tx.setAttribute("y",y+3);tx.setAttribute("text-anchor","end");tx.setAttribute("font-size","11");tx.setAttribute("fill","#7F9288");tx.textContent=fmtRub0(v);svg.append(tx)}
  let d="";pts.forEach((p,i)=>d+=(i?"L":"M")+X(i)+" "+Y(p.v)+" ");
  const path=document.createElementNS(NS,"path");path.setAttribute("d",d);path.setAttribute("fill","none");path.setAttribute("stroke","#2F6B50");path.setAttribute("stroke-width","2.5");path.setAttribute("stroke-linejoin","round");svg.append(path);
  pts.forEach((p,i)=>{const c=document.createElementNS(NS,"circle");c.setAttribute("cx",X(i));c.setAttribute("cy",Y(p.v));c.setAttribute("r","4");c.setAttribute("fill","#2F6B50");c.style.cursor="default";
    bindTip(c,`<div class="t-name">${p.full}</div><b>${fmtRub(p.v)}</b>`);svg.append(c);
    const tx=document.createElementNS(NS,"text");tx.setAttribute("x",X(i));tx.setAttribute("y",H-10);tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","11");tx.setAttribute("fill","#4E6A5C");tx.textContent=p.lab;svg.append(tx)});
  return svg;
}

// сортируемая таблица
function sortTable(cols,data,state){
  const cont=el("div");
  function draw(){
    cont.innerHTML="";const t=el("table",{class:"tb"});
    const htr=el("tr");
    cols.forEach(c=>{const cls=(c.cls||"")+(state.key===c.key?(state.dir<0?" desc":" asc"):"");
      const th=el("th",{class:cls.trim()},c.h);th.onclick=()=>{if(state.key===c.key)state.dir*=-1;else{state.key=c.key;state.dir=c.num?-1:1}draw()};htr.append(th)});
    const thead=el("thead");thead.append(htr);t.append(thead);
    const rows=data.slice().sort((a,b)=>{let va=a[state.key],vb=b[state.key];
      if(va==null)return 1;if(vb==null)return -1;
      return typeof va==="number"?state.dir*(va-vb):state.dir*String(va).localeCompare(String(vb),"ru")});
    const tb=el("tbody");rows.forEach(r=>{const tr=el("tr");cols.forEach(c=>tr.append(c.cell(r)));tb.append(tr)});
    t.append(tb);const w=el("div",{class:"tb-wrap"});w.append(t);cont.append(w);
  }
  draw();return cont;
}

const pnlEnts=lvl=>PN.entities.filter(e=>e.level===lvl);

  if(PN.partial)root.append(el("div",{class:"note"},"Предпросмотр: загружена часть таблиц. Остальные кластеры добавим; Горбунов — нет доступа."));

  // контролы
  const ctl=el("div",{class:"pnl-ctl"});
  ctl.append(selCtl("Уровень",[{v:"УК",t:"Вся УК"},{v:"Кластер",t:"Кластер"},{v:"Точка",t:"Точка"}],st.pnlLevel,
    v=>{st.pnlLevel=v;const e=pnlEnts(v);if(v!=="УК"&&e.length)st.pnlId=e[0].id;renderPnl()}));
  let eid="uk";
  if(st.pnlLevel!=="УК"){

      ents.map(e=>({v:e.id,t:e.level==="Точка"?(e.cluster+" — "+e.name):e.name})),st.pnlId,
      v=>{st.pnlId=v;renderPnl()}));

  ctl.append(selCtl("Месяц (для графиков)",PN.months.map(m=>({v:m,t:m})),st.pnlMonth,v=>{st.pnlMonth=v;renderPnl()}));
  root.append(ctl);
  const entName=st.pnlLevel==="УК"?"вся сеть УК":(PN.entities.find(e=>e.id===eid)||{}).name;
  $("#scope-sub").textContent=st.pnlLevel+": "+entName+" · помесячно"+(PN.partial?" · (часть данных)":"");

  const S=PN.series[eid]||{},months=PN.months,items=PN.items;
  // таблица P&L
  const t=el("table",{class:"pnl"});
  const htr=el("tr");htr.append(el("th",{class:"it"},"Статья"));
  months.forEach(m=>htr.append(el("th",{class:m===st.pnlMonth?"selm":""},m.slice(0,3))));
  const thead=el("thead");thead.append(htr);t.append(thead);
  const tb=el("tbody");
  items.forEach(it=>{
    const tr=el("tr",{class:it===PN.rev?"rev":(it===PN.net?"net":"")});
    tr.append(el("th",{class:"it",title:it},it));
    months.forEach(m=>{const v=(S[m]||{})[it];
      const cls=(m===st.pnlMonth?"selm ":"")+((v!=null&&v<0)?"neg":"");
      tr.append(el("td",{class:cls.trim()},v==null?"—":fmtRub0(v)));});
    tb.append(tr);
  });
  t.append(tb);
  const wrap=el("div",{class:"tb-wrap"});wrap.append(t);
  root.append(cardWrap("P&L по месяцам, ₽ (выделен "+st.pnlMonth+")",null,wrap));

  // графики
  const g=el("div",{class:"g2"});
  const sm=S[st.pnlMonth]||{};
  const exp=items.filter(it=>it!==PN.rev&&it!==PN.net).map(it=>({label:it,value:sm[it]||0}))
    .filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,12);
  g.append(cardWrap("Структура расходов — "+st.pnlMonth,null,bars(exp,{strong:true})));
  const netPts=months.map(m=>({lab:m.slice(0,3),full:m,v:(S[m]||{})[PN.net]||0}));
  g.append(cardWrap("Чистая прибыль УК по месяцам",null,line(netPts)));
  root.append(g);
}

function render(){
  $("#stamp").textContent="Остатки и продажи на "+DATA.asOf;
  const isP=st.page==="pnl";
  $(".filters").hidden=isP;
  $("#page-title").textContent=isP?"RAFAM — финансы (P&L)":"RAFAM — аналитика";
  const gp=$("#go-pnl");if(gp)gp.textContent=isP?"← Операционный дашборд":"Финансы · P&L →";
  $("#tab-points").hidden=isP||st.tab!=="points";
  $("#tab-cities").hidden=isP||st.tab!=="cities";
  $("#tab-pnl").hidden=!isP;
  if(isP){$("#scope-title").textContent="Отчёт о прибылях и убытках";renderPnl();}
  else{
    $("#scope-title").textContent=st.tab==="points"?"Точки":"Города";
    $("#scope-sub").textContent="Период: "+periodLabel()+" · "+(st.city||"вся сеть")+" · "+(st.cat||"все категории");
    if(st.tab==="points")renderPoints();else renderCities();
  }
  $("#foot").textContent="RAFAM · управленческая аналитика · данные на "+DATA.asOf;
}
(function(){const gp=$("#go-pnl");if(!gp)return;if(!PN){gp.hidden=true;return;}gp.onclick=()=>{st.page=(st.page==="pnl"?"ops":"pnl");render()};})();
initFilters();render();
</script>
</body></html>
